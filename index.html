<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>EMPLOYEE MANAGEMENT SYSTEM</h1>
        <p id="dateTime"></p>
    </header>

    <main>

     
        <section class="search-section">
            <input type="text" id="searchInput" placeholder="Search Employee">
            <button id="searchBtn">Search</button>
        </section>


        <section class="filters">
            <button data-department="All">All Employees</button>
            <button data-department="IT">IT</button>
            <button data-department="HR">HR</button>
            <button data-department="Finance">Finance</button>
            <button data-department="Marketing">Marketing</button>
        </section>

   
        <section class="sort-section">
            <button id="sortName">Sort by Name</button>
            <button id="sortAge">Sort by Age</button>
            <button id="sortSalary">Sort by Salary</button>
        </section>

    
        <p id="message">Loading employees...</p>

   
        <section class="dashboard">
            <div>
                <h3>Total Employees</h3>
                <p id="employeeCount">0</p>
            </div>

            <div>
                <h3>Total Salary</h3>
                <p id="totalSalary">₹0</p>
            </div>

            <div>
                <h3>Average Salary</h3>
                <p id="averageSalary">₹0</p>
            </div>
        </section>

      
        <section id="employeeContainer" class="employee-container"></section>

    
        <section class="highest-salary">
            <h2>Highest Paid Employee</h2>
            <div id="highestEmployee"></div>
        </section>

    
        <section class="add-section">

            <h2>ADD EMPLOYEE</h2>

            <form id="employeeForm">

                <input
                    type="text"
                    id="name"
                    placeholder="Employee Name"
                >

                <input
                    type="number"
                    id="age"
                    placeholder="Age"
                >

                <input
                    type="email"
                    id="email"
                    placeholder="Email"
                >

                <input
                    type="phone"
                    id="phone"
                    placeholder="phone"
                >

                <select id="department">
                    <option value="">Select Department</option>
                    <option value="IT">IT</option>
                    <option value="HR">HR</option>
                    <option value="Finance">Finance</option>
                    <option value="Marketing">Marketing</option>
                </select>

                <input
                    type="number"
                    id="salary"
                    placeholder="Salary"
                >

                <button type="submit">Add Employee</button>

            </form>

            <div id="errorMessage"></div>

        </section>

    </main>

    <script src="js/script.js"></script>

</body>
</html>
